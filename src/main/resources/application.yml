spring:
  application:
    name: bookbridge

  datasource:
    url: jdbc:h2:file:./data/bookbridge
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update   # automatically create/update tables
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8081

bookbridge:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-in-production}
    expiration-ms: 86400000  # 24 hours