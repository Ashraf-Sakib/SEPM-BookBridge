spring:
  application:
    name: bookbridge

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookbridge}
    username: ${SPRING_DATASOURCE_USERNAME:bookbridge}
    password: ${SPRING_DATASOURCE_PASSWORD:bookbridge}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8082

bookbridge:
  upload-dir: uploads
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:bookbridge-dev-secret-key-should-be-32-bytes-minimum}
    expiration-ms: 86400000