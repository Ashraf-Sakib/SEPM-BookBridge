<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('List a Book')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width:760px;">
    <h2 style="margin-bottom:8px;color:#1a202c">List a Book</h2>
    <p style="color:#718096;margin-bottom:24px">
        Add your book details to publish it on BookBridge.
    </p>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/seller/books/new}" th:object="${bookCreateRequest}" method="post"
          style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:24px;display:grid;gap:16px">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group" style="margin:0">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}" placeholder="Book title" />
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="author">Author</label>
            <input id="author" type="text" th:field="*{author}" placeholder="Author name" />
            <div class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="price">Price (optional)</label>
            <input id="price" type="number" min="0" step="0.01" th:field="*{price}" placeholder="0.00" />
            <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="description">Description (optional)</label>
            <textarea id="description" th:field="*{description}" rows="5"
                      style="width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;resize:vertical"
                      placeholder="Condition, edition, notes for buyers..."></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end">
            <a href="/dashboard"
               style="text-decoration:none;padding:11px 16px;border-radius:8px;border:1px solid #cbd5e0;color:#2d3748">Cancel</a>
            <button class="btn btn-primary" type="submit" style="width:auto;padding:11px 18px">Publish</button>
        </div>
    </form>
</div>

</body>
</html>
