<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('List a Book')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<style>
    @media (max-width: 760px) {
        .sell-actions {
            flex-direction: column-reverse;
        }

        .sell-actions a,
        .sell-actions button {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<div class="container" style="max-width:760px;">
    <h2 style="margin-bottom:8px;color:#1a202c;display:flex;align-items:center;gap:10px">
        <svg class="hi hi-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
        </svg>
        List a Book
    </h2>
    <p style="color:#718096;margin-bottom:24px">
        Add your book details to publish it on BookBridge.
    </p>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/seller/books/new}" th:object="${bookCreateRequest}" method="post" enctype="multipart/form-data"
          style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:24px;display:grid;gap:16px">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group" style="margin:0">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}" placeholder="Book title" />
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="author">Author</label>
            <input id="author" type="text" th:field="*{author}" placeholder="Author name" />
            <div class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="price">Price (optional)</label>
            <input id="price" type="number" min="0" step="0.01" th:field="*{price}" placeholder="0.00" />
            <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="discountPercentage">Discount Percentage (optional)</label>
            <input id="discountPercentage" type="number" min="0" max="100" step="0.01" th:field="*{discountPercentage}" placeholder="0" />
            <div class="field-error" th:if="${#fields.hasErrors('discountPercentage')}" th:errors="*{discountPercentage}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="available">Availability</label>
            <select id="available" th:field="*{available}">
                <option value="true">Available</option>
                <option value="false">Sold</option>
            </select>
            <small style="color:#718096;font-size:12px">Mark the listing as sold when it is no longer available.</small>
        </div>

        <div class="form-group" style="margin:0">
            <label for="description">Description (optional)</label>
            <textarea id="description" th:field="*{description}" rows="5"
                      style="width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;resize:vertical"
                      placeholder="Condition, edition, notes for buyers..."></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="categorySlug">Category (optional)</label>
            <select id="categorySlug" th:field="*{categorySlug}">
                <option value="">Uncategorized</option>
                <option th:each="cat : ${categories}" th:value="${cat.slug}" th:text="${cat.name}">Category</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('categorySlug')}" th:errors="*{categorySlug}"></div>
        </div>

        <div class="form-group" style="margin:0">
            <label for="image">Book Image (optional)</label>
            <input id="image" type="file" th:field="*{image}" accept="image/png,image/jpeg,image/webp,image/gif" />
            <small style="color:#718096;font-size:12px">Supported: JPG, PNG, WEBP, GIF (max 5MB). A clear cover photo will show on your listing.</small>
            <div id="imagePreview"
                 style="margin-top:10px;width:180px;height:180px;border-radius:10px;border:1.5px dashed #cbd5e1;background:#f8fafc;display:grid;place-items:center;color:#64748b;font-size:12px;overflow:hidden">
                Preview
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
        </div>

        <div class="sell-actions" style="display:flex;gap:10px;justify-content:flex-end">
            <a href="/dashboard"
               style="text-decoration:none;padding:11px 16px;border-radius:8px;border:1px solid #cbd5e0;color:#2d3748;display:inline-flex;align-items:center;gap:8px">
                <svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
                </svg>
                Cancel
            </a>
            <button class="btn btn-primary" type="submit" style="width:auto;padding:11px 18px;display:inline-flex;align-items:center;gap:8px">
                <svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                </svg>
                Publish
            </button>
        </div>
    </form>
</div>

<script>
    (function () {
        const input = document.getElementById('image');
        const preview = document.getElementById('imagePreview');

        if (!input || !preview) return;

        input.addEventListener('change', function () {
            const file = input.files && input.files[0];
            if (!file) {
                preview.innerHTML = 'Preview';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (event) {
                preview.innerHTML = '';
                const img = document.createElement('img');
                img.src = event.target.result;
                img.alt = 'Selected image preview';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    })();
</script>

</body>
</html>
