<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chat')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<style>
    .chat-shell {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        min-height: 650px;
    }

    .chat-item {
        transition: background .2s, transform .15s;
    }

    .chat-item:hover {
        background: #f8fafc;
        transform: translateX(2px);
    }

    .chat-item.active {
        background: #ecfdf5;
        border-left: 3px solid #0f766e;
    }

    .chat-bubble {
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 12px;
    }

    .chat-bubble.sent {
        background: #dcfce7;
        margin-left: auto;
    }

    .chat-bubble.received {
        background: #fff;
        border: 1px solid #e5e7eb;
    }

    @media (max-width: 960px) {
        .chat-shell {
            grid-template-columns: 1fr;
            min-height: auto;
        }
    }

    @media (max-width: 640px) {
        .chat-input-form {
            flex-direction: column;
        }

        .chat-input-form button {
            width: 100%;
            justify-content: center;
        }

        .chat-bubble {
            max-width: 88%;
        }
    }
</style>

<div class="container" style="max-width:1200px;padding-top:24px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#1f2937;">
        <svg class="hi hi-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12c0-4.97 4.03-9 9-9s9 4.03 9 9-4.03 9-9 9a8.96 8.96 0 01-4.95-1.49L3 20.25l.74-3.05A8.96 8.96 0 012.25 12z"/>
        </svg>
        <h2 style="font-size:24px;">Conversations</h2>
    </div>

    <div class="chat-shell">

        <aside style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;overflow:auto;">
            <div style="padding:14px 16px;border-bottom:1px solid #e2e8f0;font-weight:600;color:#334155;">
                All chats
            </div>

              <div th:if="${#lists.isEmpty(conversations)}"
                  style="padding:18px;color:#64748b;font-size:14px;">
                 No conversations yet. Browse books and message a seller to start one.
              </div>

                            <div class="chat-item" th:each="thread : ${conversations}"
                                    th:classappend="${conversationId != null and thread.conversationId == conversationId} ? ' active' : ''"
                                 th:onclick="|window.location='/chat/' + ${thread.conversationId}|"
                  style="padding:14px 16px;border-bottom:1px solid #eef2f7;cursor:pointer;">
                <div style="display:flex;align-items:flex-start;gap:10px;">
                    <span style="width:30px;height:30px;border-radius:8px;background:#ecfeff;color:#0f766e;display:grid;place-items:center;flex:0 0 auto;">
                        <svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 6.75A2.25 2.25 0 016.75 4.5h9A2.25 2.25 0 0118 6.75v12A2.25 2.25 0 0115.75 21h-9A2.25 2.25 0 014.5 18.75v-12z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25h6M9 11.25h6M9 14.25h4.5"/>
                        </svg>
                    </span>
                    <div>
                        <div style="font-weight:600;color:#1f2937;" th:text="${thread.participantName}">User</div>
                        <p style="color:#64748b;font-size:13px;margin-top:4px;line-height:1.35;"
                           th:text="${thread.previewText}"></p>
                    </div>
                </div>
            </div>
        </aside>

        <section style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;">
            <header style="padding:14px 18px;background:#0f766e;color:#fff;display:flex;align-items:center;gap:8px;">
                <svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275"/>
                </svg>
                <div style="display:flex;flex-direction:column;gap:2px;">
                    <h3 th:text="${activeUser}" style="font-size:16px;font-weight:600;">Conversation</h3>
                </div>
            </header>

            <div th:if="${conversation != null}" style="padding:16px 20px 0 20px;background:#f9fafb;border-bottom:1px solid #e5e7eb;">
                <div style="margin-bottom:12px;">
                    <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">Initial message</div>
                    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;" th:text="${conversation.message}"></div>
                </div>
                <div th:if="${conversation.response != null}" style="margin-bottom:12px;">
                    <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">Response</div>
                    <div style="background:#dcfce7;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;" th:text="${conversation.response}"></div>
                </div>
            </div>

            <div id="messages" th:if="${conversation != null}"
                 style="flex:1;padding:18px;overflow-y:auto;background:#f8fafc;display:flex;flex-direction:column;gap:10px;">
                <div th:each="msg : ${messages}"
                     class="chat-bubble"
                     th:classappend="${msg.sender.id == currentUserId} ? ' sent' : ' received'">
                    <small style="display:block;font-size:11px;color:#6b7280;margin-bottom:4px;"
                           th:text="${msg.sender.username}"></small>
                    <span th:text="${msg.content}"></span>
                </div>
            </div>

            <div th:if="${conversation == null}"
                 style="flex:1;padding:24px;color:#64748b;display:grid;place-items:center;background:#f8fafc;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12c0-4.97 4.03-9 9-9s9 4.03 9 9-4.03 9-9 9a8.96 8.96 0 01-4.95-1.49L3 20.25l.74-3.05A8.96 8.96 0 012.25 12z"/>
                    </svg>
                    Select a conversation to continue the discussion.
                </div>
            </div>

            <form th:if="${conversation != null}" th:action="@{/chat/{id}/message(id=${conversationId})}" method="post"
                class="chat-input-form"
                  style="display:flex;gap:10px;padding:12px;border-top:1px solid #e5e7eb;background:#fff;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="text" name="content" placeholder="Type a message" required
                       style="flex:1;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:10px;" />
                <button type="submit" style="background:#0f766e;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
                    <svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0121.485 12 59.768 59.768 0 013.27 20.875L6 12zm0 0h7.5"/>
                    </svg>
                    Send
                </button>
            </form>
        </section>
    </div>
</div>

<script>
    const messages = document.getElementById('messages');
    if (messages) {
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
