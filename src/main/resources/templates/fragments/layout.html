<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | BookBridge'">BookBridge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bb-ink: #1f2937;
            --bb-muted: #64748b;
            --bb-bg: #f4f7f8;
            --bb-surface: #ffffff;
            --bb-brand: #1f9f7a;
            --bb-brand-strong: #13795b;
            --bb-line: #dbe3e6;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at 12% 18%, #dff5ec 0 24%, transparent 25%),
                radial-gradient(circle at 84% 72%, #dbeffd 0 20%, transparent 21%),
                var(--bb-bg);
            color: var(--bb-ink);
            min-height: 100vh;
        }
        nav { background: #2d3748; padding: 0 24px;
            display: flex; align-items: center;
            justify-content: space-between; height: 56px;
            position: sticky; top: 0; z-index: 20;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12); }
        nav .brand { color: #fff; font-size: 20px;
            font-weight: 700; text-decoration: none; }
        nav .brand span { color: #68d391; }
        nav .nav-links { display: flex; gap: 8px; align-items: center; }
        nav a { color: #cbd5e0; text-decoration: none;
            padding: 8px 14px; border-radius: 6px;
            font-size: 14px; transition: background .2s; }
        nav a:hover { background: #4a5568; color: #fff; }
        nav .btn-nav { background: #48bb78; color: #fff !important;
            font-weight: 500; }
        nav .btn-nav:hover { background: #38a169 !important; }
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
        .surface-card {
            background: #fff;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
        }
        .interactive-card {
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .interactive-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
            border-color: #cbd5e1;
        }
        .soft-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .soft-input:focus {
            border-color: #1f9f7a;
            box-shadow: 0 0 0 3px rgba(31, 159, 122, 0.15);
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 5px 10px;
            background: #ecfdf5;
            color: #166534;
            font-size: 12px;
            font-weight: 600;
        }
        .auth-shell {
            min-height: calc(100vh - 56px);
            display: grid;
            place-items: center;
            padding: 30px 20px 40px;
        }
        .auth-split-card {
            width: min(980px, 100%);
            min-height: 560px;
            background: var(--bb-surface);
            border: 1px solid var(--bb-line);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            box-shadow: 0 24px 50px rgba(16, 24, 40, 0.12);
        }
        .auth-visual {
            position: relative;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 34px;
            color: #ffffff;
        }
        .auth-visual::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(170deg, rgba(4, 20, 26, 0.18), rgba(3, 20, 26, 0.72));
        }
        .auth-visual-content {
            position: relative;
            z-index: 1;
        }
        .auth-visual-title {
            font-family: 'Newsreader', serif;
            font-size: 38px;
            line-height: 1.1;
            margin-bottom: 10px;
        }
        .auth-visual-subtitle {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 18px;
            max-width: 28ch;
        }
        .auth-visual-points {
            display: grid;
            gap: 10px;
            font-size: 14px;
        }
        .auth-visual-point {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .auth-form-panel {
            padding: 34px;
            display: flex;
            align-items: center;
        }
        .auth-card {
            width: 100%;
            max-width: 410px;
            margin: 0 auto;
        }
        .auth-card h2 { font-size: 24px; margin-bottom: 8px; color: #1a202c; }
        .auth-card .subtitle { color: #718096; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px;
            font-weight: 500; color: #4a5568; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 8px;
            font-size: 14px; outline: none; transition: border .2s; }
        .form-group input:focus, .form-group select:focus { border-color: #48bb78; }
        .field-error { color: #e53e3e; font-size: 12px; margin-top: 4px; }
        .btn { width: 100%; padding: 11px; border: none;
            border-radius: 8px; font-size: 15px;
            font-weight: 600; cursor: pointer; transition: background .2s; }
        .btn-primary { background: #48bb78; color: #fff; }
        .btn-primary:hover { background: #38a169; }
        .alert { padding: 12px 16px; border-radius: 8px;
            font-size: 13px; margin-bottom: 20px; }
        .alert-error { background: #fff5f5; color: #c53030;
            border: 1px solid #fed7d7; }
        .alert-success { background: #f0fff4; color: #276749;
            border: 1px solid #c6f6d5; }
        .alert-danger { background: #fff5f5; color: #b42318;
            border: 1px solid #fecaca; }
        .auth-link { text-align: center; margin-top: 20px;
            font-size: 13px; color: #718096; }
        .auth-link a { color: #48bb78; font-weight: 500;
            text-decoration: none; }
        .hi {
            width: 1.1rem;
            height: 1.1rem;
            display: inline-block;
            vertical-align: middle;
        }
        .hi-lg {
            width: 1.45rem;
            height: 1.45rem;
        }

        @media (max-width: 900px) {
            nav {
                height: auto;
                min-height: 56px;
                align-items: flex-start;
                gap: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
            }
            nav .nav-links {
                flex-wrap: wrap;
                justify-content: flex-end;
                row-gap: 6px;
            }
            .auth-shell {
                padding-top: 20px;
            }
            .auth-split-card {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            .auth-visual {
                min-height: 240px;
                padding: 24px;
            }
            .auth-visual-title {
                font-size: 30px;
            }
            .auth-form-panel {
                padding: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .interactive-card,
            nav a,
            .btn,
            .form-group input {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<nav th:fragment="navbar">
    <a class="brand" href="/"><span>Book</span>Bridge</a>
    <div class="nav-links">
        <a href="/books">Browse Books</a>
        <a href="/login" sec:authorize="isAnonymous()">Login</a>
        <a href="/register" class="btn-nav" sec:authorize="isAnonymous()">Register</a>
        <a href="/dashboard" sec:authorize="isAuthenticated()">Dashboard</a>
        <a href="/wishlist" sec:authorize="isAuthenticated()">Wishlist</a>
        <a href="/orders" sec:authorize="isAuthenticated()">Orders</a>
        <a href="/chat" sec:authorize="isAuthenticated()">Message</a>
        <a href="/admin" sec:authorize="hasRole('ADMIN')">Admin</a>
        <form th:action="@{/logout}" method="post"
              sec:authorize="isAuthenticated()"
              style="margin:0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit"
                    style="background:none;border:none;cursor:pointer;
                           color:#cbd5e0;padding:8px 14px;font-size:14px;">
                Logout
            </button>
        </form>
    </div>
</nav>

</body>
</html>
