<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div style="text-align:center;padding:80px 24px 40px">
    <h1 style="font-size:40px;color:#1a202c;margin-bottom:16px">
        Buy &amp; Sell Second-Hand Books
    </h1>
    <p style="font-size:18px;color:#718096;margin-bottom:36px;
              max-width:500px;margin-left:auto;margin-right:auto">
        BookBridge connects book lovers. Give your old books a new home.
    </p>

    <!-- Show when not logged in -->
    <div sec:authorize="isAnonymous()">
        <a href="/register"
           style="background:#48bb78;color:#fff;padding:14px 32px;
                  border-radius:8px;text-decoration:none;font-size:16px;
                  font-weight:600;margin-right:12px">
            Get Started
        </a>
        <a href="/books"
           style="background:#fff;color:#4a5568;padding:14px 32px;
                  border-radius:8px;text-decoration:none;font-size:16px;
                  font-weight:600;border:1.5px solid #e2e8f0">
            Browse Books
        </a>
    </div>

    <!-- Show when logged in -->
    <div sec:authorize="isAuthenticated()">
        <a href="/dashboard"
           style="background:#48bb78;color:#fff;padding:14px 32px;
                  border-radius:8px;text-decoration:none;font-size:16px;
                  font-weight:600">
            Go to Dashboard
        </a>
    </div>
</div>

</body>
</html>
