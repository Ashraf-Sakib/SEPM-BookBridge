<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Orders')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h2 style="margin-bottom:8px;color:#1a202c;display:flex;align-items:center;gap:10px">
        <svg class="hi hi-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3.75h1.5l1.636 7.864a2.25 2.25 0 002.205 1.786h8.77a2.25 2.25 0 002.205-1.786L20.25 6.75H6.172"/>
            <circle cx="9" cy="18.75" r="1.5"/>
            <circle cx="17.25" cy="18.75" r="1.5"/>
        </svg>
        My Orders
    </h2>
    <p style="color:#718096;margin-bottom:24px">
        Your order history will appear here.
    </p>

    <h3 style="margin:14px 0 10px;color:#1a202c">Purchased Books</h3>
    <div th:if="${#lists.isEmpty(purchaseOrders)}"
         style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:18px;color:#4a5568">
        You have not purchased any books yet.
    </div>
    <div th:if="${!#lists.isEmpty(purchaseOrders)}" style="display:grid;gap:10px;margin-bottom:22px">
        <article th:each="order : ${purchaseOrders}" style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px">
            <div style="font-weight:700;color:#1f2937" th:text="${order.bookTitle}">Book</div>
            <div style="font-size:13px;color:#64748b">Seller: <strong th:text="${order.sellerUsername}">seller</strong></div>
            <div style="font-size:13px;color:#64748b">Price: <strong th:text="${'৳' + order.salePrice}">৳0.00</strong></div>
            <div style="font-size:12px;color:#94a3b8" th:text="${#temporals.format(order.salesDateTime, 'yyyy-MM-dd HH:mm')}">date</div>
        </article>
    </div>

    <h3 style="margin:14px 0 10px;color:#1a202c">Sold by You</h3>
    <div th:if="${#lists.isEmpty(salesOrders)}"
         style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:18px;color:#4a5568">
        No completed sales yet.
    </div>
    <div th:if="${!#lists.isEmpty(salesOrders)}" style="display:grid;gap:10px">
        <article th:each="order : ${salesOrders}" style="background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px">
            <div style="font-weight:700;color:#1f2937" th:text="${order.bookTitle}">Book</div>
            <div style="font-size:13px;color:#64748b">Buyer: <strong th:text="${order.buyerUsername}">buyer</strong></div>
            <div style="font-size:13px;color:#64748b">Price: <strong th:text="${'৳' + order.salePrice}">৳0.00</strong></div>
            <div style="font-size:12px;color:#94a3b8" th:text="${#temporals.format(order.salesDateTime, 'yyyy-MM-dd HH:mm')}">date</div>
        </article>
    </div>
</div>

</body>
</html>
