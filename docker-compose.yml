services:
  db:
    image: postgres:16-alpine
    container_name: bookbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookbridge}
      POSTGRES_USER: ${POSTGRES_USER:-bookbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookbridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookbridge} -d ${POSTGRES_DB:-bookbridge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookbridge-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bookbridge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookbridge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookbridge}
      JWT_SECRET: ${JWT_SECRET:-bookbridge-dev-secret-key-should-be-32-bytes-minimum}
      BOOKBRIDGE_UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - bookbridge_uploads:/app/uploads

volumes:
  postgres_data:
  bookbridge_uploads:
